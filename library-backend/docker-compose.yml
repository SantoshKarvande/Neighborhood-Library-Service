version: "3.9"

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: library_db
    environment:
      POSTGRES_USER:     library_user
      POSTGRES_PASSWORD: library_pass
      POSTGRES_DB:       library_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Alembic migrations (one-shot) ───────────────────────────────────────────
  migrate:
    build: .
    container_name: library_migrate
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://library_user:library_pass@db:5432/library_db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ─── FastAPI app ─────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: library_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://library_user:library_pass@db:5432/library_db
      SQL_ECHO:     ""          # set to "1" to enable query logging
    ports:
      - "8000:8000"
    volumes:
      - .:/app                  # live-reload during development
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pg_data:


